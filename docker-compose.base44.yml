services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      # Bind-mount only the source page so edits are served immediately,
      # without rebuilding an image (and without exposing .git).
      - ./index.html:/usr/share/nginx/html/index.html:ro
    environment:
      - BASE44_PREVIEW_MODE
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      base44.project: HTML Viewer
      base44.kind: web
      base44.port: "3000"
